<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title">
  <title id="title">古钱正面示意</title>
  <defs>
    <radialGradient id="metal" cx="34%" cy="26%" r="75%">
      <stop offset="0" stop-color="#f4d69a"/>
      <stop offset=".32" stop-color="#c99c55"/>
      <stop offset=".73" stop-color="#966b37"/>
      <stop offset="1" stop-color="#503b25"/>
    </radialGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f6dfad"/>
      <stop offset=".5" stop-color="#9b6d36"/>
      <stop offset="1" stop-color="#51351c"/>
    </linearGradient>
    <mask id="cut"><rect width="240" height="240" fill="white"/><rect x="96" y="96" width="48" height="48" rx="2" fill="black"/></mask>
  </defs>
  <g mask="url(#cut)">
    <circle cx="120" cy="120" r="113" fill="#3b3023"/>
    <circle cx="120" cy="120" r="110" fill="url(#metal)" stroke="url(#lip)" stroke-width="7"/>
    <circle cx="120" cy="120" r="99" fill="none" stroke="#f4d89e" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="120" cy="120" r="91" fill="none" stroke="#51391f" stroke-opacity=".65" stroke-width="3"/>
    <circle cx="120" cy="120" r="79" fill="none" stroke="#f1cc89" stroke-opacity=".35" stroke-width="1.5"/>
    <rect x="89" y="89" width="62" height="62" rx="3" fill="#51381e" stroke="#e3bc75" stroke-width="3"/>
    <rect x="94" y="94" width="52" height="52" rx="2" fill="none" stroke="#f4dba8" stroke-opacity=".55" stroke-width="2"/>
    <g fill="#4f351c" stroke="#e6bb74" stroke-width=".4" font-family="Songti SC, STSong, SimSun, serif" font-size="29" font-weight="700" text-anchor="middle">
      <text x="120" y="76">乾</text><text x="120" y="190">隆</text>
      <text x="63" y="130">寶</text><text x="177" y="130">通</text>
    </g>
  </g>
  <rect x="96" y="96" width="48" height="48" rx="2" fill="none" stroke="#3b2817" stroke-width="3"/>
</svg>
