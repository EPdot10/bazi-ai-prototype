    <circle cx="120" cy="120" r="99" fill="none" stroke="#dfc68f" stroke-opacity=".45" stroke-width="2"/>
    <circle cx="120" cy="120" r="91" fill="none" stroke="#5d452c" stroke-opacity=".5" stroke-width="2.5"/>
